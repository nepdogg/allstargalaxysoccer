name: Visual QA Screenshots
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  visual-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run visual-qa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allstar-galaxy-visual-qa
          path: |
            visual-qa-report
            test-results
          retention-days: 30
